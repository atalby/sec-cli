name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run bash suites
        run: |
          set -e
          for t in test_install test_sync_guard test_write_honesty test_sentinel test_dispatch; do
            echo "=== $t ==="
            bash "tests/$t.sh"
          done
