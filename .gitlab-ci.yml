# GitLab CI/CD Pipeline Configuration — AxiomMesh Standard
stages:
  - lint
  - test
  - security
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - if [ -f pyproject.toml ]; then pip install -e .; fi

lint_code:
  stage: lint
  script:
    - pip install ruff || true
    - ruff check . || true

run_tests:
  stage: test
  script:
    - pip install pytest || true
    - pytest -v || true

zero_secret_audit:
  stage: security
  script:
    - echo "🔍 Verifying Zero-Plaintext Secret Compliance..."
    - if [ -f bin/sec ]; then ./bin/sec check; fi
